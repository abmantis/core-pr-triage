# Post a review or reply on home-assistant/core as hacoreview.
# The routine dispatches this instead of posting itself: posts made through Claude's GitHub proxy get a footer.
# Results go out as annotations: a `posted` notice with the IDs, or an error with the reason.

name: Post
run-name: Post core#${{ inputs.pr }} ${{ inputs.kind }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number in home-assistant/core"
        required: true
        type: number
      kind:
        description: "review: a COMMENT review; reply: a reply in a review thread or the PR conversation"
        required: true
        type: choice
        options: [review, reply]
      payload:
        description: "Base64 of the review JSON (commit_id, event, body, comments) or of the reply's markdown"
        required: true
        type: string
      reply_to:
        description: "For a reply: the review comment that starts the thread; empty to reply in the PR conversation"
        required: false
        type: string

permissions: {}

jobs:
  post:
    name: Post
    runs-on: ubuntu-latest
    env:
      PR: ${{ inputs.pr }}
      KIND: ${{ inputs.kind }}
      PAYLOAD_B64: ${{ inputs.payload }}
      REPLY_TO: ${{ inputs.reply_to }}
    steps:
      - name: Check the request
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a number"; exit 1; }
          [[ "$KIND" == review || "$KIND" == reply ]] || { echo "::error::kind must be review or reply"; exit 1; }
          [[ -z "$REPLY_TO" || "$REPLY_TO" =~ ^[0-9]+$ ]] || { echo "::error::reply_to must be a comment ID"; exit 1; }
          base64 -d <<<"$PAYLOAD_B64" > payload || { echo "::error::payload isn't base64"; exit 1; }
          python3 - <<'PY'
          import json, os, re, sys

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          text = open("payload", encoding="utf-8").read()
          if os.environ["KIND"] == "reply":
              if not text.strip():
                  fail("reply is empty")
              sys.exit(0)

          if os.environ["REPLY_TO"]:
              fail("reply_to is only for a reply")
          try:
              r = json.loads(text)
          except ValueError:
              fail("review payload isn't JSON")
          if not isinstance(r, dict):
              fail("review payload must be a JSON object")
          problems = []
          if set(r) - {"commit_id", "event", "body", "comments"}:
              problems.append("unexpected fields")
          if r.get("event") != "COMMENT":
              problems.append("event must be COMMENT")
          if not re.fullmatch(r"[0-9a-f]{40}", str(r.get("commit_id", ""))):
              problems.append("commit_id must be a full commit SHA")
          if not str(r.get("body", "")).strip():
              problems.append("body is empty")
          if not isinstance(r.get("comments", []), list):
              problems.append("comments must be a list")
          if problems:
              fail("; ".join(problems))
          PY

      - name: Post it
        env:
          GH_TOKEN: ${{ secrets.HACOREVIEW_TOKEN }}
        run: |
          set -euo pipefail
          fail() {
            msg=$(cat out.json err.txt 2>/dev/null || true)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
            echo "::error::$msg"
            exit 1
          }
          core="repos/home-assistant/core"

          if [ "$KIND" = review ]; then
            gh api -X POST "$core/pulls/$PR/reviews" --input payload > out.json 2> err.txt || fail
            review_id=$(jq .id out.json)
            # The review is posted, so a failure here mustn't fail the run; the routine lists them itself
            comment_ids=$(gh api "$core/pulls/$PR/reviews/$review_id/comments?per_page=100" | jq -c '[.[].id]') || comment_ids=null
            echo "::notice title=posted::{\"review_id\":$review_id,\"comment_ids\":$comment_ids}"
            exit 0
          fi

          jq -Rs '{body: .}' payload > body.json
          if [ -n "$REPLY_TO" ]; then
            gh api -X POST "$core/pulls/$PR/comments/$REPLY_TO/replies" --input body.json > out.json 2> err.txt || fail
          else
            gh api -X POST "$core/issues/$PR/comments" --input body.json > out.json 2> err.txt || fail
          fi
          echo "::notice title=posted::{\"comment_ids\":[$(jq .id out.json)]}"
